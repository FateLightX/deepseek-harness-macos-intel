# Build the DeepSeek Harness Desktop application for macOS 26 on Intel (x64).
#
# The upstream tree is cloned from its remote URL during the run, so this
# repository stores only the workflow and never a copy of the source.
#
# A build happens only when upstream publishes a new release. The newest
# `dsh-v*` release tag names the source to build and the version to publish:
# `dsh-v0.2.1-rc.2` produces `desktop-macos-x64-0.2.1-rc.2`. That release tag is
# also the record of what has been built, so "already built" simply means the
# release exists and deleting it asks for a rebuild. No marker tags, no state
# files, no version input.
#
# Release stage (rc/dev/alpha) is irrelevant here: whatever upstream publishes
# most recently is built.
#
# The check runs on Linux so an unchanged upstream costs seconds instead of a
# macOS runner. GitHub cron is UTC, so 22:00 in UTC+8 is 14:00 UTC.
name: Build Desktop · macOS 26 Intel (x64)

run-name: macOS x64 desktop · ${{ inputs.release_tag || 'latest release' }} · run ${{ github.run_number }}

on:
  schedule:
    # 22:00 Asia/Shanghai (UTC+8). GitHub cron is UTC, and scheduled starts are
    # best-effort: a busy queue can delay them.
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 上游 release tag（如 dsh-v0.2.1-rc.1）；留空则取最新 release
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-desktop-macos-intel
  cancel-in-progress: false

env:
  UPSTREAM: deepseek-ai/deepseek-harness
  # Release tags double as the build record; renaming this without migrating the
  # existing releases would make every published version look unbuilt.
  PREFIX: desktop-macos-x64
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Has upstream published a new release?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.gate.outputs.build }}
      upstream_tag: ${{ steps.gate.outputs.upstream_tag }}
      version: ${{ steps.gate.outputs.version }}
      release_tag: ${{ steps.gate.outputs.release_tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED: ${{ inputs.release_tag }}
    steps:
      - name: Compare the newest upstream release with this repository
        id: gate
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED// /}" ]; then
            tag="$REQUESTED"
            source="requested"
          else
            # Newest published `dsh-v*` release. Drafts are excluded, and the
            # release stage is deliberately not filtered.
            tag="$(gh release list --repo "$UPSTREAM" --exclude-drafts --limit 50 --json tagName \
              --jq '[.[] | select(.tagName | startswith("dsh-v"))][0].tagName')"
            source="newest upstream release"
          fi
          test -n "$tag" && test "$tag" != "null" || { echo "::error::no dsh-v* release found upstream"; exit 1; }

          gh release view "$tag" --repo "$UPSTREAM" >/dev/null
          version="${tag#dsh-v}"
          release_tag="$PREFIX-$version"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            build=false
            note="\`$release_tag\` already exists"
          else
            build=true
            note="\`$release_tag\` does not exist yet"
          fi

          {
            echo "upstream_tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
            echo "build=$build" >> "$GITHUB_OUTPUT"
          }

          {
            echo "## Upstream release check"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Upstream release | \`$UPSTREAM@$tag\` ($source) |"
            echo "| Desktop version | \`$version\` |"
            echo "| This repository | \`$release_tag\` |"
            echo "| Decision | **$([ "$build" = true ] && echo build || echo skip)** — $note |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$build" = true ]; then
            echo "::notice::building $tag ($note)"
          else
            echo "::notice::skipping the build ($note)"
          fi

  build:
    name: macOS 26 Intel (x64) unsigned DMG
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-26-intel
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      TARGET_DIR: apps/desktop/.desktop-build/targets/mac-x64
    steps:
      - name: Report the build host
        run: |
          set -euo pipefail
          sw_vers
          echo "architecture: $(uname -m)"
          echo "developer dir: $(xcode-select -p)"
          df -h /

      - name: Reclaim disk space
        run: |
          set -euo pipefail
          # Nothing here needs the Android SDK, iOS simulator runtimes, .NET,
          # GHC, or Homebrew's download cache, and each is gigabytes. A full
          # desktop build holds the pnpm store, an Electron distribution, a
          # Python/Node primary runtime, and two electron-builder trees at once,
          # while a standard Intel macOS runner has a 14 GB SSD.
          for path in \
            /Users/runner/Library/Android \
            /Users/runner/Library/Developer/CoreSimulator \
            /Users/runner/Library/Caches/Homebrew \
            /Users/runner/Library/Caches/pip \
            /Users/runner/.gradle \
            /Users/runner/.cargo/registry \
            /usr/local/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc ; do
            if [ -e "$path" ]; then
              echo "removing $path"
              sudo rm -rf "$path"
            fi
          done
          df -h /

      - name: Reclaim Xcode when the disk is still tight
        run: |
          set -euo pipefail
          # `cc` compiles the native flock addon and `codesign`/`hdiutil` sign
          # and pack the DMG; the Command Line Tools provide all of them, so the
          # full Xcode installation is only kept while the disk allows it.
          available_kb="$(df -k / | awk 'NR == 2 { print $4 }')"
          echo "available before: $((available_kb / 1024 / 1024)) GiB"
          if [ "$available_kb" -ge $((30 * 1024 * 1024)) ]; then
            echo "keeping Xcode"
            exit 0
          fi
          clt=/Library/Developer/CommandLineTools
          if [ ! -x "$clt/usr/bin/clang" ]; then
            echo "Command Line Tools are missing; keeping Xcode and continuing with reduced disk headroom"
            exit 0
          fi
          for bundle in /Applications/Xcode*.app; do
            if [ -d "$bundle" ]; then
              echo "removing $bundle"
              sudo rm -rf "$bundle"
            fi
          done
          sudo xcode-select --switch "$clt"
          echo "developer dir: $(xcode-select -p)"
          cc --version
          df -h /

      - name: Check out the upstream release tag
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.upstream_tag }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm the checkout is that release
        run: |
          set -euo pipefail
          # The tag is immutable, so this only guards a bad ref: publishing a
          # different version than the release tag promised would be silent.
          declared="$(node -p "require('./source/apps/desktop/package.json').version")"
          test "$declared" = "${{ needs.check.outputs.version }}" || {
            echo "::error::checked out ${{ needs.check.outputs.upstream_tag }} declares $declared, expected ${{ needs.check.outputs.version }}"
            exit 1
          }
          echo "building ${{ needs.check.outputs.upstream_tag }} (version $declared)"

      - uses: pnpm/action-setup@v5.0.0
        with:
          package_json_file: source/package.json

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Validate the packaging configuration and toolchain
        working-directory: source
        run: pnpm run package:desktop:mac:x64:unsigned --check

      - name: Build the unsigned macOS x64 DMG
        working-directory: source
        run: pnpm run package:desktop:mac:x64:unsigned

      - name: Verify the built application
        id: verify
        working-directory: source
        run: |
          set -euo pipefail
          app="$TARGET_DIR/unsigned-artifacts/mac/DeepSeek Harness.app"
          binary="$app/Contents/MacOS/DeepSeek Harness"
          test -f "$binary"
          architectures="$(lipo -archs "$binary")"
          case "$architectures" in
            *x86_64*) ;;
            *) echo "::error::expected an x86_64 build, got $architectures"; exit 1 ;;
          esac
          file "$binary"
          echo "LSMinimumSystemVersion: $(/usr/libexec/PlistBuddy -c 'Print LSMinimumSystemVersion' "$app/Contents/Info.plist")"
          codesign --verify --deep --verbose=2 "$app"
          dmg="$(find "$TARGET_DIR/unsigned-artifacts" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          name="$(basename "$dmg")"
          # The artifact name carries the version electron-builder wrote, which
          # must be the release version rather than the manifest default.
          case "$name" in
            *"${{ needs.check.outputs.version }}"*) ;;
            *) echo "::error::$name does not carry version ${{ needs.check.outputs.version }}"; exit 1 ;;
          esac
          {
            echo "dmg=$dmg"
            echo "name=$name"
            echo "architectures=$architectures"
            echo "sha256=$(shasum -a 256 "$dmg" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"
          echo "built $name"

      - name: Upload the DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.verify.outputs.name }}
          path: source/${{ steps.verify.outputs.dmg }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload the packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packaging-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish the release that records this build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.release_tag }}
          UPSTREAM_TAG: ${{ needs.check.outputs.upstream_tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          dmg="source/${{ steps.verify.outputs.dmg }}"
          name="$(basename "$dmg")"
          shasum -a 256 "$dmg" > "/tmp/$name.sha256"
          cat "/tmp/$name.sha256"

          {
            printf '%s\n\n' 'DeepSeek Harness Desktop, built for macOS 26 on Intel (x64).'
            printf '%s\n\n' '| | |' '| --- | --- |'
            printf '| Upstream release | `%s@%s` |\n' "$UPSTREAM" "$UPSTREAM_TAG"
            printf '| Version | `%s` |\n' "$VERSION"
            printf '| Artifact | `%s` |\n' "$name"
            printf '| Architectures | `%s` |\n' '${{ steps.verify.outputs.architectures }}'
            printf '| SHA-256 | `%s` |\n' '${{ steps.verify.outputs.sha256 }}'
            printf '%s\n\n' '| Signing | Ad-hoc signed, **not notarized** |'
            printf '%s\n\n' 'This installer is unsigned, so Gatekeeper blocks the first launch of a downloaded copy. After installing, clear the quarantine attribute:'
            printf '```sh\n%s\n```\n\n' 'xattr -dr com.apple.quarantine "/Applications/DeepSeek Harness.app"'
            printf '%s\n\n' 'The tag names the upstream release this was built from. Deleting this release is how you ask for that version to be rebuilt.'
            printf '%s\n' 'The artifact is an x64 build: native on Intel Macs, Rosetta 2 on Apple Silicon.'
          } > /tmp/release-notes.md
          cat /tmp/release-notes.md

          # Upstream publishes prereleases only, so this must never take the
          # repository's "Latest" slot.
          gh release create "$TAG" "$dmg" "/tmp/$name.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DeepSeek Harness Desktop · macOS x64 · $VERSION" \
            --notes-file /tmp/release-notes.md \
            --prerelease

      - name: Summarize the run
        if: always()
        run: |
          available_kb="$(df -k / | awk 'NR == 2 { print $4 }')"
          {
            echo "## macOS 26 Intel (x64) desktop build"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Runner | \`macos-26-intel\` |"
            echo "| Upstream release | \`$UPSTREAM@${{ needs.check.outputs.upstream_tag }}\` |"
            echo "| Version | \`${{ needs.check.outputs.version }}\` |"
            echo "| Artifact | \`${{ steps.verify.outputs.name }}\` |"
            echo "| Architectures | \`${{ steps.verify.outputs.architectures }}\` |"
            echo "| SHA-256 | \`${{ steps.verify.outputs.sha256 }}\` |"
            echo "| Signing | ad-hoc signed, not notarized |"
            echo "| Free disk at the end | $((available_kb / 1024 / 1024)) GiB |"
          } >> "$GITHUB_STEP_SUMMARY"
