# Build the DeepSeek Harness Desktop application for macOS 26 on Intel (x64).
#
# The upstream tree is cloned from its remote URL during the run, so this
# repository stores only the workflow and never a copy of the source.
#
# Building only when upstream changed needs one fact: which upstream commit the
# published installer was built from. Instead of keeping that fact in a marker
# tag, a state file, or a repository variable, the release tag carries it:
#
#     desktop-macos-x64-<upstream commit, 12 hex>
#
# So "already built" simply means that release exists, and deleting a release
# is the supported way to ask for that commit to be rebuilt. No bookkeeping job,
# no extra writes, and no way for the record to drift from the artifacts.
#
# The gate runs on Linux so an unchanged upstream costs twenty seconds instead
# of a macOS runner. GitHub cron is UTC, so 22:00 in UTC+8 is 14:00 UTC.
name: Build Desktop · macOS 26 Intel (x64)

run-name: macOS x64 desktop · ${{ inputs.source_ref || 'master' }} · run ${{ github.run_number }}

on:
  schedule:
    # 22:00 Asia/Shanghai (UTC+8). GitHub cron is UTC, and scheduled starts are
    # best-effort: a busy queue can delay them.
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 上游 deepseek-ai/deepseek-harness 的分支或标签（例如 master、dsh-v0.2.1-rc.2）
        type: string
        required: true
        default: master
      build_version:
        description: 构建版本：auto 按日期编号，product 使用上游清单版本，或显式写出受支持的版本
        type: string
        required: true
        default: auto

permissions:
  contents: write

concurrency:
  group: build-desktop-macos-intel
  cancel-in-progress: false

env:
  UPSTREAM: deepseek-ai/deepseek-harness
  # Release tags are the build record; never rename this without also migrating
  # the existing releases, or every commit looks unbuilt.
  RELEASE_PREFIX: desktop-macos-x64
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Has upstream changed?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.gate.outputs.build }}
      commit: ${{ steps.gate.outputs.commit }}
      release_tag: ${{ steps.gate.outputs.release_tag }}
    env:
      # A scheduled run carries no dispatch inputs; this is its default.
      SOURCE_REF: ${{ inputs.source_ref || 'master' }}
    steps:
      - name: Resolve the upstream commit and look for its release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          encoded="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1], safe=""))' "$SOURCE_REF")"
          commit="$(gh api "repos/$UPSTREAM/commits/$encoded" --jq .sha)"
          tag="$RELEASE_PREFIX-${commit:0:12}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            build=false
            note="\`$tag\` already publishes this commit"
          else
            build=true
            note="no \`$tag\` release yet"
          fi

          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

          {
            echo "## Upstream check"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Upstream | \`$UPSTREAM@$SOURCE_REF\` |"
            echo "| Commit | \`$commit\` |"
            echo "| Release tag | \`$tag\` |"
            echo "| Decision | **$([ "$build" = true ] && echo build || echo skip)** — $note |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$build" = true ]; then
            echo "::notice::building $commit ($note)"
          else
            echo "::notice::skipping the build ($note)"
          fi

  build:
    name: macOS 26 Intel (x64) unsigned DMG
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-26-intel
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      BUILD_VERSION: ${{ inputs.build_version || 'auto' }}
      TARGET_DIR: apps/desktop/.desktop-build/targets/mac-x64
    steps:
      - name: Report the build host
        run: |
          set -euo pipefail
          sw_vers
          echo "architecture: $(uname -m)"
          echo "developer dir: $(xcode-select -p)"
          df -h /

      - name: Reclaim disk space
        run: |
          set -euo pipefail
          # Nothing here needs the Android SDK, iOS simulator runtimes, .NET,
          # GHC, or Homebrew's download cache, and each is gigabytes. A full
          # desktop build holds the pnpm store, an Electron distribution, a
          # Python/Node primary runtime, and two electron-builder trees at once,
          # while a standard Intel macOS runner has a 14 GB SSD.
          for path in \
            /Users/runner/Library/Android \
            /Users/runner/Library/Developer/CoreSimulator \
            /Users/runner/Library/Caches/Homebrew \
            /Users/runner/Library/Caches/pip \
            /Users/runner/.gradle \
            /Users/runner/.cargo/registry \
            /usr/local/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc ; do
            if [ -e "$path" ]; then
              echo "removing $path"
              sudo rm -rf "$path"
            fi
          done
          df -h /

      - name: Reclaim Xcode when the disk is still tight
        run: |
          set -euo pipefail
          # `cc` compiles the native flock addon and `codesign`/`hdiutil` sign
          # and pack the DMG; the Command Line Tools provide all of them, so the
          # full Xcode installation is only kept while the disk allows it.
          available_kb="$(df -k / | awk 'NR == 2 { print $4 }')"
          echo "available before: $((available_kb / 1024 / 1024)) GiB"
          if [ "$available_kb" -ge $((30 * 1024 * 1024)) ]; then
            echo "keeping Xcode"
            exit 0
          fi
          clt=/Library/Developer/CommandLineTools
          if [ ! -x "$clt/usr/bin/clang" ]; then
            echo "Command Line Tools are missing; keeping Xcode and continuing with reduced disk headroom"
            exit 0
          fi
          for bundle in /Applications/Xcode*.app; do
            if [ -d "$bundle" ]; then
              echo "removing $bundle"
              sudo rm -rf "$bundle"
            fi
          done
          sudo xcode-select --switch "$clt"
          echo "developer dir: $(xcode-select -p)"
          cc --version
          df -h /

      - name: Check out the upstream commit the gate resolved
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.commit }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm the checkout is the commit that was checked
        run: |
          set -euo pipefail
          # Building anything else would publish an installer for a commit the
          # gate never inspected.
          test "$(git -C source rev-parse HEAD)" = "${{ needs.check.outputs.commit }}"
          echo "building $UPSTREAM@${{ needs.check.outputs.commit }}"

      - uses: pnpm/action-setup@v5.0.0
        with:
          package_json_file: source/package.json

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Validate the packaging configuration and toolchain
        working-directory: source
        env:
          PACKAGE_BUILD_VERSION: ${{ env.BUILD_VERSION }}
        run: |
          set -euo pipefail
          pnpm run package:desktop:mac:x64:unsigned --check --build-version "$PACKAGE_BUILD_VERSION"

      - name: Build the unsigned macOS x64 DMG
        working-directory: source
        env:
          PACKAGE_BUILD_VERSION: ${{ env.BUILD_VERSION }}
        run: |
          set -euo pipefail
          pnpm run package:desktop:mac:x64:unsigned --build-version "$PACKAGE_BUILD_VERSION"

      - name: Verify the built application
        id: verify
        working-directory: source
        run: |
          set -euo pipefail
          app="$TARGET_DIR/unsigned-artifacts/mac/DeepSeek Harness.app"
          binary="$app/Contents/MacOS/DeepSeek Harness"
          test -f "$binary"
          architectures="$(lipo -archs "$binary")"
          case "$architectures" in
            *x86_64*) ;;
            *) echo "::error::expected an x86_64 build, got $architectures"; exit 1 ;;
          esac
          file "$binary"
          echo "LSMinimumSystemVersion: $(/usr/libexec/PlistBuddy -c 'Print LSMinimumSystemVersion' "$app/Contents/Info.plist")"
          codesign --verify --deep --verbose=2 "$app"
          dmg="$(find "$TARGET_DIR/unsigned-artifacts" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          name="$(basename "$dmg")"
          version="${name#deepseek-harness-}"
          version="${version%-mac-x64-unsigned.dmg}"
          {
            echo "dmg=$dmg"
            echo "name=$name"
            echo "version=$version"
            echo "architectures=$architectures"
            echo "sha256=$(shasum -a 256 "$dmg" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"
          echo "built $name"

      - name: Upload the DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.verify.outputs.name }}
          path: source/${{ steps.verify.outputs.dmg }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload the packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packaging-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish the release that records this build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.release_tag }}
          COMMIT: ${{ needs.check.outputs.commit }}
        run: |
          set -euo pipefail
          dmg="source/${{ steps.verify.outputs.dmg }}"
          name="$(basename "$dmg")"
          shasum -a 256 "$dmg" > "/tmp/$name.sha256"
          cat "/tmp/$name.sha256"

          {
            printf '%s\n\n' 'DeepSeek Harness Desktop, built for macOS 26 on Intel (x64).'
            printf '%s\n\n' '| | |' '| --- | --- |'
            printf '| Upstream | `%s` |\n' "$UPSTREAM"
            printf '| Upstream commit | `%s` |\n' "$COMMIT"
            printf '| Build version | `%s` |\n' '${{ steps.verify.outputs.version }}'
            printf '| Artifact | `%s` |\n' "$name"
            printf '| Architectures | `%s` |\n' '${{ steps.verify.outputs.architectures }}'
            printf '| SHA-256 | `%s` |\n' '${{ steps.verify.outputs.sha256 }}'
            printf '%s\n\n' '| Signing | Ad-hoc signed, **not notarized** |'
            printf '%s\n\n' 'This installer is unsigned, so Gatekeeper blocks the first launch of a downloaded copy. After installing, clear the quarantine attribute:'
            printf '```sh\n%s\n```\n\n' 'xattr -dr com.apple.quarantine "/Applications/DeepSeek Harness.app"'
            printf '%s\n\n' 'The tag names the upstream commit this release was built from. Deleting the release is how you ask for that commit to be rebuilt.'
            printf '%s\n' 'The artifact is an x64 build: native on Intel Macs, Rosetta 2 on Apple Silicon.'
          } > /tmp/release-notes.md
          cat /tmp/release-notes.md

          # A prerelease upstream version must not take the repository's "Latest" slot.
          maturity=()
          case '${{ steps.verify.outputs.version }}' in
            *-*) maturity+=(--prerelease) ;;
          esac

          gh release create "$TAG" "$dmg" "/tmp/$name.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DeepSeek Harness Desktop · macOS x64 · ${{ steps.verify.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            "${maturity[@]}"

      - name: Summarize the run
        if: always()
        run: |
          available_kb="$(df -k / | awk 'NR == 2 { print $4 }')"
          {
            echo "## macOS 26 Intel (x64) desktop build"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Runner | \`macos-26-intel\` |"
            echo "| Upstream | \`$UPSTREAM@${{ needs.check.outputs.commit }}\` |"
            echo "| Artifact | \`${{ steps.verify.outputs.name }}\` |"
            echo "| Build version | \`${{ steps.verify.outputs.version }}\` |"
            echo "| Architectures | \`${{ steps.verify.outputs.architectures }}\` |"
            echo "| SHA-256 | \`${{ steps.verify.outputs.sha256 }}\` |"
            echo "| Signing | ad-hoc signed, not notarized |"
            echo "| Free disk at the end | $((available_kb / 1024 / 1024)) GiB |"
          } >> "$GITHUB_STEP_SUMMARY"
